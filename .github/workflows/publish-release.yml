name: Publish Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - next
        default: next

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build_stable:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@6854221e62e0759fe8deffc48ccb9c91daf8f9b0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm release:build

      - name: Pack publishable packages
        run: pnpm release:pack

      - name: Upload release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release-tarballs
          path: .release-tarballs
          if-no-files-found: error
          retention-days: 1

  publish_stable:
    needs: build_stable
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: release-control
    outputs:
      release_tag: ${{ steps.release_version.outputs.tag }}

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download release tarballs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: npm-release-tarballs
          path: .release-tarballs

      - name: Check trusted publishing runtime
        run: node tools/release/assert-trusted-publishing-runtime.mjs

      - name: Publish packages to npm
        run: node tools/release/publish-tarballs.mjs --tag latest

      - name: Resolve release version
        id: release_version
        run: node tools/release/read-release-version.mjs --github-output

  create_stable_release_metadata:
    needs: publish_stable
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.publish_stable.outputs.release_tag }}" "${{ github.event.pull_request.merge_commit_sha }}" -m "${{ needs.publish_stable.outputs.release_tag }}"
          git push origin "${{ needs.publish_stable.outputs.release_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.publish_stable.outputs.release_tag }}" \
            --verify-tag \
            --title "${{ needs.publish_stable.outputs.release_tag }}" \
            --generate-notes

  build_next:
    # npm trusted publishing allows one trusted publisher config per package, so
    # stable and next both route through this workflow file.
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'next'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Next publish must run from main. Got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@6854221e62e0759fe8deffc48ccb9c91daf8f9b0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive prerelease version
        run: pnpm release:version:prerelease

      - name: Build publishable packages
        run: pnpm release:build

      - name: Pack publishable packages
        run: pnpm release:pack

      - name: Upload release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release-tarballs
          path: .release-tarballs
          if-no-files-found: error
          retention-days: 1

  publish_next:
    needs: build_next
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'next'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: release-control

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download release tarballs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: npm-release-tarballs
          path: .release-tarballs

      - name: Check trusted publishing runtime
        run: node tools/release/assert-trusted-publishing-runtime.mjs

      - name: Publish packages to npm with next tag
        run: node tools/release/publish-tarballs.mjs --tag next
