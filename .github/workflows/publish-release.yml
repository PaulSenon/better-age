name: Publish Release

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - next
        default: next

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build_stable:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm release:build

      - name: Pack publishable packages
        run: pnpm release:pack

      - name: Upload release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-tarballs
          path: .release-tarballs
          # The directory name starts with "." and would be skipped otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish_stable:
    needs: build_stable
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # checkout release tooling
      id-token: write # npm trusted publishing (OIDC)
    runs-on: ubuntu-latest
    environment: release-control
    outputs:
      release_tag: ${{ steps.release_version.outputs.tag }}

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download release tarballs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-release-tarballs
          path: .release-tarballs

      - name: Check trusted publishing runtime
        run: node tools/release/assert-trusted-publishing-runtime.mjs

      - name: Publish packages to npm
        run: node tools/release/publish-tarballs.mjs --tag latest

      - name: Resolve release version
        id: release_version
        run: node tools/release/read-release-version.mjs --github-output

  create_stable_release_metadata:
    needs: publish_stable
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # push release tag + create GitHub release
    runs-on: ubuntu-latest

    steps:
      # Keeps the checkout credential because this job pushes the tag. It runs
      # no dependency install or third-party code, only git + gh.
      - name: Checkout merged release commit # zizmor: ignore[artipacked]
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # Values go through env, never `${{ }}` inside `run:`, so shell never
      # parses workflow-expanded text.
      - name: Create release tag
        env:
          RELEASE_TAG: ${{ needs.publish_stable.outputs.release_tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish_stable.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

  build_next:
    # Stable and next share this workflow file so each npm package needs one
    # trusted publisher entry (workflow + environment) instead of two.
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'next'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Next publish must run from main. Got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive prerelease version
        run: pnpm release:version:prerelease

      - name: Build publishable packages
        run: pnpm release:build

      - name: Pack publishable packages
        run: pnpm release:pack

      - name: Upload release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-tarballs
          path: .release-tarballs
          # The directory name starts with "." and would be skipped otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish_next:
    needs: build_next
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.channel == 'next'
    permissions:
      contents: read # checkout release tooling
      id-token: write # npm trusted publishing (OIDC)
    runs-on: ubuntu-latest
    environment: release-control

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download release tarballs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-release-tarballs
          path: .release-tarballs

      - name: Check trusted publishing runtime
        run: node tools/release/assert-trusted-publishing-runtime.mjs

      - name: Publish packages to npm with next tag
        run: node tools/release/publish-tarballs.mjs --tag next
